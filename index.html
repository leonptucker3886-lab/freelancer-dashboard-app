<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Freelancer Dashboard | LeonLink</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="style.css"><style>#authView:not(.hide){flex-direction:column;gap:22px}.shots-wrap{width:100%;max-width:980px;text-align:center}.shots-wrap h3{font-size:16px;color:#52525B;margin:0 0 6px}.shots{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 16px;justify-content:center}.shots figure{flex:0 0 200px;scroll-snap-align:center;text-align:center}.shots img{width:100%;height:auto;border-radius:18px;border:1px solid #DEDDD8;box-shadow:0 12px 30px rgba(0,0,0,.10);background:#fff}.shots figcaption{font-size:14px;font-weight:600;color:#52525B;margin-top:8px}@media(max-width:900px){.shots{justify-content:flex-start}.shots figure{flex-basis:62%}}</style></head><body>
<div id="authView" class="auth"><div class="card"><div class="logo">Leon<span>Link</span></div><h2 id="authTitle">Log in</h2>
<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password">
<button id="authBtn" onclick="doAuth()">Log in</button><button class="ghost sm" id="toggle" onclick="toggleMode()">No account? Sign up</button><div class="msg" id="amsg"></div></div><div class="shots-wrap"><h3>A quick look inside Dashline</h3><div class="shots"><figure><img src="/shots/dashline-home.webp" alt="Dashline Home dashboard screen on a phone" loading="lazy" width="460" height="763"><figcaption>Home dashboard</figcaption></figure><figure><img src="/shots/dashline-clients.webp" alt="Dashline Clients screen on a phone" loading="lazy" width="460" height="763"><figcaption>Clients</figcaption></figure><figure><img src="/shots/dashline-reports.webp" alt="Dashline Reports screen on a phone" loading="lazy" width="460" height="763"><figcaption>Reports</figcaption></figure><figure><img src="/shots/dashline-contracts.webp" alt="Dashline Contracts screen on a phone" loading="lazy" width="460" height="763"><figcaption>Contracts</figcaption></figure></div></div></div>
<div id="appView" class="hide"><aside><div class="logo">Leon<span>Link</span></div><nav id="nav"></nav><div class="side-foot"><div id="planBadge" class="badge"></div><div id="email" class="muted sm"></div><button class="ghost sm" onclick="sb.auth.signOut()">Log out</button></div></aside>
<main><div class="top"><h1 id="title"></h1><div id="actions"></div></div><div id="view"></div></main></div>
<div id="modal" class="modal hide" onclick="if(event.target===this)closeModal()"><div class="card" id="modalBody"></div></div>
<div id="toast" class="toast hide"></div>
<script src="app.js"></script></body></html>
