<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Review and sign | Dashline</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#FAFAF9;color:#18181B}.w{max-width:720px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border:1px solid #DEDDD8;border-radius:12px;padding:20px;margin-bottom:14px}.m{color:#71717A;font-size:14px}.body{white-space:pre-wrap;line-height:1.6}
input{width:100%;font-size:16px;padding:12px;border:1px solid #DEDDD8;border-radius:8px;margin:8px 0}button{width:100%;min-height:48px;background:#2A78D6;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700}
.sig{font-family:'Brush Script MT','Segoe Script',cursive;font-size:30px}.ok{background:#E6F4E6;color:#065f06;padding:12px 16px;border-radius:10px}label{font-size:14px;display:flex;gap:8px;align-items:flex-start;margin:6px 0}label input{width:auto;margin:3px 0}</style></head><body><div class="w" id="v"><p class="m">Loading…</p></div>
<script>
const sb=supabase.createClient('https://cjtutkvhyzjsgclqvylg.supabase.co','sb_publishable_E48ovT9wWxduLxnzPXL_5g_SnNl2rqz');
const t=new URLSearchParams(location.search).get('t'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),v=document.getElementById('v');
async function load(){const{data:k}=t?await sb.rpc('fd_contract_get',{t}):{data:null};if(!k){v.innerHTML='<p>This link is invalid or has expired.</p>';return}
 const signed=k.status==='Signed';
 v.innerHTML=`<div class="card"><div class="m">${esc(k.biz)}${k.client?' · for '+esc(k.client):''}</div><h2 style="margin:6px 0 14px">${esc(k.title)}</h2><div class="body">${esc(k.body)}</div></div>
 <div class="card">${signed?`<div class="ok">Signed electronically</div><p class="sig">${esc(k.signed_name)}</p><p class="m">${esc(k.signed_name)} · ${new Date(k.signed_at).toLocaleString()}</p>`:
 `<h3 style="margin-top:0">Sign</h3><input id="n" placeholder="Type your full legal name" autocomplete="name"><p class="sig" id="pv" style="min-height:40px;margin:4px 0"></p><label><input type="checkbox" id="ag"> I agree to the terms above and that typing my name is my electronic signature.</label><button id="sb">Sign contract</button><p class="m" id="er" style="color:#DC2626"></p>`}</div>`;
 if(!signed){n.oninput=()=>pv.textContent=n.value;document.getElementById('sb').onclick=async()=>{if(!ag.checked)return er.textContent='Please tick the agreement box.';const{error}=await sb.rpc('fd_contract_sign',{t,nm:n.value});if(error)return er.textContent=error.message;load()}}}
load();
</script></body></html>
